<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="adminDashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <li><span class="logo">📂</span><span class="text">Manage Users</span></li>
                <li><span class="logo">✅</span><span class="text">Approvals</span></li>
                <li><span class="logo">📊</span><span class="text">Reports</span></li>
                <li><span class="logo">💬</span><span class="text">Testimonials</span></li>
                <li><span class="logo">📋</span><span class="text">Assessments</span></li>
                
            </ul>
        </aside>
        
        <main class="dashboard">
            <header>
                <h2>Welcome, Admin!</h2>
            </header>
            
            <div class="analytics">
                <div class="card">
                    <h3>Project Approvals</h3>
                    <p>Approved: 45</p>
                    <p>Pending: 12</p>
                    <p>Rejected: 8</p>
                </div>
                <div class="card">
                    <h3>User Management</h3>
                    <p>Students: 150</p>
                    <p>Faculty: 30</p>
                    <p>Admins: 5</p>
                </div>
            </div>
            
            <section class="charts">
                <div class="chart-container">
                    <h3>Project Submission Trends</h3>
                    <canvas id="submissionChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>SDG Impact</h3>
                    <canvas id="sdgChart"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let ctx1 = document.getElementById('submissionChart').getContext('2d');
            new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
                    datasets: [{
                        label: 'Submissions',
                        data: [10, 20, 35, 40, 50, 60],
                        borderColor: '#4CAF50',
                        fill: false
                    }]
                }
            });

            let ctx2 = document.getElementById('sdgChart').getContext('2d');
            new Chart(ctx2, {
                type: 'pie',
                data: {
                    labels: ["Climate Action", "Education", "Health", "Innovation"],
                    datasets: [{
                        data: [30, 25, 20, 25],
                        backgroundColor: ['#f94144', '#f9c74f', '#90be6d', '#577590']
                    }]
                }
            });
        });
    </script>
</body>
</html>
